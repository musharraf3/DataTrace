[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrace-investigator"
version = "0.1.0"
description = "Evidence-driven investigation of SQL metric changes with Meta Model API"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.30,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
