name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m datatrace.evaluate --mode offline
      - run: python -m datatrace.evaluate --mode offline --split stress --output artifacts/stress-evaluation.json
      - run: python -m datatrace sample --output artifacts/incident.json
      - run: python -m datatrace investigate artifacts/incident.json --output-dir artifacts/cli-report
